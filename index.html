<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcel and Jane's Page</title>
  <style>
    :root {
      --bg: #a8b4d4;
      --nav: #606060;
      --nav-text: #f4f4f4;
      --nav-sep: #aaa;
      --row: #ddd;
      --link: #0b3d91;
      --link-hover: #062456;
      --sep: #667;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      font: 16px/1.45 system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: var(--bg);
      text-align: left;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }

    .wrap {
      max-width: none;
      margin: 0;
      padding: 0.85rem 0 2rem;
    }

    header h1 {
      margin: 0 0 0.65rem;
      padding: 0 1rem;
      font-size: 1.4rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.25rem 0.4rem;
      padding: 0.5rem 1rem;
    }
    .row .label {
      font-weight: 700;
      margin-right: 0.2rem;
    }
    .row .sep {
      color: var(--sep);
      user-select: none;
      margin: 0 0.1rem;
    }
    .row a { white-space: nowrap; }

    /* Games — original topnav grey */
    .row-games {
      background: var(--nav);
      color: var(--nav-text);
    }
    .row-games a {
      color: var(--nav-text);
    }
    .row-games a:hover {
      color: #fff;
      text-decoration: underline;
    }
    .row-games .sep { color: var(--nav-sep); }
    .row-games .label { color: #fff; }

    /* Markets / Misc — original grpStyle light grey */
    .row-soft {
      background: var(--row);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Marcel and Jane's Page</h1>
    </header>

    <main class="rows">
      <div class="row row-games">
        <a class="label" href="/games/">Games</a><span class="sep">:</span>
        <a href="/games/mj03/">Mahjong</a>
        <span class="sep">|</span>
        <a href="/games/A45s/">Auction 45s</a>
        <span class="sep">|</span>
        <a href="/games/yoyo/">Yoyo</a>
        <span class="sep">|</span>
        <a href="/games/jigsaw/">Jigsaw</a>
      </div>

      <div class="row row-soft">
        <span class="label">Markets:</span>
        <a href="https://finance.yahoo.com/">Yahoo Finance</a>
        <span class="sep">·</span>
        <a href="https://finance.yahoo.com/world-indices">World Indices</a>
        <span class="sep">·</span>
        <a href="https://www.dividendchannel.com/drip-returns-calculator/">DRIP Calc</a>
        <span class="sep">·</span>
        <a href="/old/markets.htm">More…</a>
      </div>

      <div class="row row-soft">
        <a class="label" href="/misclinks.html">Misc</a><span class="sep">:</span>
        <a href="https://www.teslamotorsclub.com/forum.php">Tesla Forums</a>
        <span class="sep">·</span>
        <a href="http://www.pizzamonster.org/pics/index.html">Pictures</a>
      </div>
    </main>
  </div>
</body>
</html>
