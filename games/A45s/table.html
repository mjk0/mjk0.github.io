<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auction 45s — Table</title>
  <link rel="stylesheet" href="css/a45s_web.css?v=20260820u">
</head>
<body class="felt-page">
  <div class="felt">
    <header class="felt-head">
      <div class="head-left">
        <button type="button" class="score-chip ew" title="Score history" aria-label="White score, open history" aria-expanded="false" aria-controls="hist">
          White <strong id="sc-ew">0</strong>
        </button>
        <button type="button" class="score-chip ns" title="Score history" aria-label="Red score, open history" aria-expanded="false" aria-controls="hist">
          Red <strong id="sc-ns">0</strong>
        </button>
        <span id="contract-chip" class="contract-chip" hidden>
          <span id="contract-who"></span>
          <span id="contract-suit" class="contract-suit"></span>
          <span id="contract-bid"></span>
        </span>
        <span id="meta" class="sub head-deals"></span>
      </div>
      <div class="head-right">
        <div class="gear-wrap">
          <button id="rank-gear" class="ghost rank-gear" type="button" title="Table options" aria-label="Table options" aria-haspopup="true" aria-expanded="false" aria-controls="gear-pop">⚙</button>
          <div id="gear-pop" class="gear-pop" hidden>
            <label class="gear-check">
              <input id="rank-check" type="checkbox" checked>
              <span>Rank strip</span>
            </label>
          </div>
        </div>
        <button id="fill-btn" class="ghost fill-btn" type="button" hidden title="Show fill-in counts" aria-label="Show fill-in counts" aria-pressed="false">+</button>
        <button id="leavegame" class="ghost" type="button">Leave</button>
      </div>
      <div id="hist" class="hist-pop" hidden></div>
    </header>

    <div id="side-pocket" class="felt-pocket" hidden>
      <div id="side-cards" class="side-cards"></div>
      <span id="side-label" class="side-label">Kitty</span>
    </div>
    <div class="felt-opp seatbox" data-slot="2"><div class="fill-plus from-o" hidden></div></div>
    <div class="felt-left seatbox" data-slot="1"><div class="fill-plus from-l" hidden></div></div>
    <div class="felt-center">
      <div id="keep-panel" class="keep-panel" hidden>
        <p id="keep-headline" class="keep-headline"></p>
        <p id="keep-copy" class="keep-copy"></p>
        <div id="keep-trumps" class="trump-pick"></div>
      </div>
      <div id="trick-nav" class="inspect-nav trick-nav" hidden>
        <button id="trick-prev" class="inspect-step" type="button" aria-label="Previous trick">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <p id="trick-title" class="sub"></p>
        <button id="trick-next" class="inspect-step" type="button" aria-label="Next trick">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </button>
      </div>
      <div id="trick" class="trick" aria-label="Current trick"></div>
    </div>
    <div class="felt-right seatbox" data-slot="3"><div class="fill-plus from-r" hidden></div></div>

    <div class="felt-you">
      <div id="bid-acts" class="bid-self" hidden></div>
      <div id="rank-strip" class="rank-strip" hidden>
        <div id="rank-rows" class="rank-rows"></div>
        <button id="rank-hide" class="rank-hide" type="button" title="Hide rank strip" aria-label="Hide rank strip">×</button>
      </div>
      <div id="you-hand-wrap" class="you-hand-wrap">
        <button id="hand-sort" class="hand-sort" type="button" hidden>Sort</button>
        <div id="you-hand" class="hand-row"></div>
        <div id="you-fill-plus" class="fill-plus from-s" hidden></div>
        <div id="you-bid-oval" class="bid-oval" hidden></div>
      </div>
      <div id="scorecard" class="scorecard" hidden>
        <table class="scorecard-inner">
          <colgroup>
            <col>
            <col class="scorecard-team">
            <col class="scorecard-team">
          </colgroup>
          <tr>
            <th>
              <div class="scorecard-go">
                <button id="next-hand" type="button">Deal again</button>
              </div>
            </th>
            <th class="pair-ew team-ew">
              <span class="scorecard-dance">
                <span id="you-ew" class="you-chip" hidden>You</span>
                White
              </span>
            </th>
            <th class="pair-ns team-ns">
              <span class="scorecard-dance">
                <span id="you-ns" class="you-chip" hidden>You</span>
                Red
              </span>
            </th>
          </tr>
          <tr>
            <td>Hand</td>
            <td id="pts-ew" class="team-ew bordleft bordbot">0</td>
            <td id="pts-ns" class="team-ns bordbot">0</td>
          </tr>
          <tr class="series-row">
            <td id="score-lbl">Series</td>
            <td class="team-ew bordleft"><span id="tot-ew" class="scorecard-dance">0</span></td>
            <td class="team-ns"><span id="tot-ns" class="scorecard-dance">0</span></td>
          </tr>
        </table>
      </div>
      <div class="you-name-row">
        <div id="you-bar" class="namebar"></div>
        <button id="replay" class="ghost" type="button" hidden title="Replay this deal" aria-label="Replay this deal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          Replay
        </button>
      </div>
    </div>

    <div class="felt-acts">
      <div id="acts" class="acts-bar"></div>
    </div>
    <div class="felt-foot">
      <p id="paused" class="sub" style="margin:0.2rem 0"></p>
      <p id="status" class="status" style="margin:0.2rem 0"></p>
    </div>
  </div>

  <div id="panel-idle-warn" class="inspect idle-warn" hidden>
    <div class="panel" role="alertdialog" aria-labelledby="idle-warn-title" aria-describedby="idle-warn-desc">
      <p id="idle-warn-title" class="sub">Table idle</p>
      <p id="idle-warn-desc" class="idle-warn-desc">
        This open table is idle and will close in
        <strong id="idle-warn-countdown">—</strong>
        unless someone stays.
      </p>
      <div class="row">
        <button type="button" id="btn-idle-stay">Stay</button>
        <button type="button" id="btn-idle-leave">Leave</button>
      </div>
    </div>
  </div>

  <div id="inspect" class="inspect" hidden>
    <div class="panel">
      <div class="inspect-nav">
        <button id="inspect-prev" class="inspect-step" type="button" aria-label="Previous trick">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <p id="inspect-title" class="sub"></p>
        <button id="inspect-next" class="inspect-step" type="button" aria-label="Next trick">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </button>
      </div>
      <div id="inspect-cards" class="trick inspect-trick" aria-label="Past trick"></div>
      <div class="row"><button id="inspect-close" type="button">Close</button></div>
    </div>
  </div>

  <script src="js/a45s_web.js?v=20260820a"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const A = A45sWeb;
    const SUITS = ['clubs', 'diamonds', 'hearts', 'spades'];
    const sess = A.getSession();
    let idleWarnEndsAt = 0;
    let idleWarnTick = null;
    let keep = new Set();
    let keepPool = '';
    let trump = null;
    let handOrder = [];
    let handMerged = false;
    const SUIT_KEY = ['cl', 'di', 'he', 'sp'];
    let ws = null;
    let paused = {};
    let leaving = false;
    let names = ['?', '?', '?', '?'];
    let me = 0;
    let lastState = null;
    let histOpen = false;
    let inspectIndex = 0;
    let reviewIndex = -1;
    let lastSummary = null;
    let replayOn = false;
    // Freeze the completed 4-card trick ~2s (same as robot lead pause) so a
    // human winner can read it. Legal lead clicks stay live and cancel it.
    const TRICK_HOLD_MS = 2000;
    let heldTrick = null;
    let holdTimer = null;
    const FILL_PREF = 'a45s.fillOverlay';
    let fillLatch = false;
    try { fillLatch = localStorage.getItem(FILL_PREF) === '1'; } catch (e) {}
    let fillGlideKey = '';
    let fillGlidePlayed = false;
    // Default on (unlike fill overlay). Missing key → show.
    const RANK_PREF = 'a45s.rankStrip';
    let rankLatch = true;
    try { if (localStorage.getItem(RANK_PREF) === '0') rankLatch = false; } catch (e) {}
    let gearPopOpen = false;

    function setStatus(msg, kind) {
      const el = $('status');
      el.textContent = msg || '';
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function rel(abs) {
      return (abs - me + 4) % 4;
    }

    function who(seat) {
      return names[seat] || '—';
    }

    function teamClass(seat) {
      return (seat & 1) === 0 ? 'ew' : 'ns';
    }

    function currentHigh(st) {
      let high = 0;
      (st.bid_history || []).forEach((b) => { if (b >= 15 && b > high) high = b; });
      return high;
    }

    function isActor(st, seat) {
      return (st.actors || []).indexOf(seat) >= 0;
    }

    function inKeepPhase(st) {
      return st.why === 'trumpselect' || st.why === 'discard';
    }

    // Pass, current high, and ? on the next bidder. Silent / outbid seats stay blank.
    function bidMarkFor(st, seat) {
      if (st.phase !== 'bidding') return null;
      const hist = st.bid_history || [];
      const from = st.bid_from != null ? st.bid_from : 0;
      const last = [null, null, null, null];
      let high = 0, highSeat = null;
      hist.forEach((b, k) => {
        const s = (from + k) & 3;
        last[s] = b;
        if (b >= 15 && b >= high) { high = b; highSeat = s; }
      });
      if ((st.actors || [])[0] === seat) return { kind: 'wait' };
      if (last[seat] != null && last[seat] < 15) return { kind: 'pass' };
      if (highSeat === seat) return { kind: 'bid', amount: high };
      return null;
    }

    // Suit + amount on the declarer once trump is named. Auction ovals are gone.
    function contractMarkFor(st, seat) {
      if (st.declarer == null || st.declarer !== seat) return null;
      if (st.trump == null) return null;
      return { kind: 'contract', amount: st.contract_bid || 0, trump: st.trump };
    }

    function paintOval(el, mark) {
      if (!el) return;
      if (!mark) {
        el.hidden = true;
        el.textContent = '';
        el.className = 'bid-oval';
        return;
      }
      el.hidden = false;
      if (mark.kind === 'wait') {
        el.className = 'bid-oval wait';
        el.textContent = '?';
      } else if (mark.kind === 'pass') {
        el.className = 'bid-oval pass';
        el.textContent = 'pass';
      } else if (mark.kind === 'contract') {
        const amt = mark.amount >= 30 ? 30 : mark.amount;
        el.className = 'bid-oval contract b' + amt;
        el.textContent = '';
        el.appendChild(A.suitSvg(mark.trump, 'oval-suit'));
        const num = document.createElement('span');
        num.textContent = String(mark.amount);
        el.appendChild(num);
      } else {
        const amt = mark.amount >= 30 ? 30 : mark.amount;
        el.className = 'bid-oval b' + amt;
        el.textContent = String(mark.amount);
      }
    }

    function makeOval(mark) {
      if (!mark) return null;
      const el = document.createElement('div');
      paintOval(el, mark);
      return el;
    }

    function fillNamebar(el, seat, actor) {
      el.className = 'namebar ' + teamClass(seat) + (actor ? ' actor' : '');
      el.innerHTML = '';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = who(seat);
      el.appendChild(nm);
      return el;
    }

    function fanForCount(n) {
      const id = n <= 0 ? 'cblank' : 'cbfan' + Math.min(5, n);
      return A.cardSvg(id, 'fan-back');
    }

    function fillCounts(st) {
      const a = st && st.fill_counts;
      return Array.isArray(a) && a.length === 4 ? a : null;
    }
    function fillForced(st) {
      if (!fillCounts(st)) return false;
      const past = (st.past_tricks || []).length;
      if (past === 0) return true;
      // Trick-1 hold only. Trick 2's 4-card freeze also has past===1 + heldTrick.
      return past === 1 && !!heldTrick && !(st.current_trick || []).length;
    }
    function fillShow(st) {
      return !!(fillCounts(st) && (fillLatch || fillForced(st)));
    }
    function fillGlideNow(st, show) {
      const c = fillCounts(st);
      const key = c ? c.join(',') : '';
      if (!key) {
        fillGlideKey = '';
        fillGlidePlayed = false;
        return false;
      }
      if (key !== fillGlideKey) {
        fillGlideKey = key;
        fillGlidePlayed = false;
      }
      if (!show || fillGlidePlayed) return false;
      fillGlidePlayed = true;
      return true;
    }
    function bindFillGlideOnce(el) {
      if (!el || el._fillGlideBound) return;
      el._fillGlideBound = true;
      el.addEventListener('animationend', (ev) => {
        if (String(ev.animationName || '').indexOf('fill-glide') === 0) {
          el.classList.remove('glide');
        }
      });
    }
    function setFillPlus(el, n, show, glide) {
      if (!el) return;
      bindFillGlideOnce(el);
      if (!show) {
        el.hidden = true;
        el.classList.remove('glide');
        el.textContent = '';
        return;
      }
      el.hidden = false;
      el.textContent = '+' + n;
      if (glide) el.classList.add('glide');
    }
    function renderFill(st, show, glide) {
      const counts = fillCounts(st);
      const btn = $('fill-btn');
      if (!counts) {
        btn.hidden = true;
        btn.classList.remove('on');
        btn.setAttribute('aria-pressed', 'false');
        setFillPlus($('you-fill-plus'), 0, false, false);
        document.querySelectorAll('.seatbox .fill-plus').forEach((el) => setFillPlus(el, 0, false, false));
        $('you-hand-wrap').classList.remove('has-fill');
        $('rank-strip').classList.remove('clear-fill');
        return;
      }
      btn.hidden = false;
      btn.classList.toggle('on', show);
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      $('you-hand-wrap').classList.toggle('has-fill', show);
      $('rank-strip').classList.toggle('clear-fill', show && !$('rank-strip').hidden);
      setFillPlus($('you-fill-plus'), counts[me], show, glide);
      document.querySelectorAll('.seatbox[data-slot]').forEach((box) => {
        const slot = +box.getAttribute('data-slot');
        const seat = (me + slot) & 3;
        setFillPlus(box.querySelector('.fill-plus'), counts[seat], show, glide);
      });
    }

    function renderSeatBox(slot, seat, st) {
      const box = document.querySelector('.seatbox[data-slot="' + slot + '"]');
      if (!box) return;
      const plus = box.querySelector('.fill-plus');
      let wrap = box.querySelector('.fan-wrap');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.className = 'fan-wrap';
        box.insertBefore(wrap, plus || box.firstChild);
      }
      // Leave +N in the wrap — detaching it restarts the glide animation.
      if (plus && plus.parentElement !== wrap) wrap.appendChild(plus);
      const nextFan = fanForCount((st.hand_counts && st.hand_counts[seat]) || 0);
      const oldFan = wrap.querySelector('.fan-back');
      if (oldFan) oldFan.replaceWith(nextFan);
      else wrap.insertBefore(nextFan, wrap.firstChild);
      const oldOv = wrap.querySelector(':scope > .bid-oval');
      if (oldOv) oldOv.remove();
      const bidOv = makeOval(bidMarkFor(st, seat));
      if (bidOv) wrap.appendChild(bidOv);
      let bar = box.querySelector(':scope > .namebar');
      if (!bar) {
        bar = document.createElement('div');
        box.appendChild(bar);
      }
      const actor = (st.actors || []).indexOf(seat) >= 0;
      fillNamebar(bar, seat, actor);
      if (st.dealer === seat) {
        const cr = A.cardSvg('crown', 'crown');
        cr.removeAttribute('viewBox');
        cr.setAttribute('viewBox', '0 0 64 64');
        bar.appendChild(cr);
      }
      if (paused[seat]) {
        const p = document.createElement('span');
        p.textContent = ' (paused)';
        bar.appendChild(p);
      }
      const contractOv = makeOval(contractMarkFor(st, seat));
      if (contractOv) bar.appendChild(contractOv);
    }

    function dropTrickHold() {
      heldTrick = null;
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    }

    function sameTrick(a, b) {
      return !!(a && b && a.length === b.length &&
        a.every((c, i) => c.seat === b[i].seat && c.card === b[i].card));
    }

    function startTrickHold(cards) {
      heldTrick = cards.map((t) => ({ seat: t.seat, card: t.card }));
      if (holdTimer) clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        holdTimer = null;
        const n = ((lastState && lastState.current_trick) || []).length;
        if (n === 4) return; // server still sitting on this trick (robot 2s)
        heldTrick = null;
        if (lastState) renderState(lastState);
      }, TRICK_HOLD_MS);
    }

    function noteTrickHold(st) {
      const cur = st.current_trick || [];
      if (cur.length === 4) {
        if (!sameTrick(heldTrick, cur)) startTrickHold(cur);
        return;
      }
      if (cur.length > 0) { dropTrickHold(); return; }
      // Empty: keep freeze until timeout, unless we left play (replay / new deal).
      if (st.phase !== 'trickplay' && st.phase !== 'handend') dropTrickHold();
      else if (!holdTimer) heldTrick = null;
    }

    function paintTrick(box, cards, opts) {
      opts = opts || {};
      box.innerHTML = '';
      const bySeat = {};
      (cards || []).forEach((t) => { bySeat[t.seat] = t.card; });
      const lead = opts.lead;
      for (let abs = 0; abs < 4; abs++) {
        const card = bySeat[abs];
        const slot = document.createElement('div');
        let cls = 'slot s' + rel(abs);
        if (!card) cls += ' empty';
        if (lead != null && abs === lead) cls += ' lead';
        slot.className = cls;
        slot.appendChild(A.cardSvg(card || 'cblank'));
        if (lead != null && abs === lead) {
          const chip = document.createElement('span');
          chip.className = 'lead-chip';
          chip.textContent = 'lead';
          slot.appendChild(chip);
        }
        box.appendChild(slot);
      }
    }

    // Hand-end: compact inspect-sized viewer; all five piles stay in the pocket.
    function clampReview(n) {
      if (reviewIndex < 0 || reviewIndex >= n) reviewIndex = n - 1;
      return reviewIndex;
    }
    function showReview(i) {
      if (!lastState || lastState.phase !== 'handend') return;
      const n = (lastState.past_tricks || []).length;
      if (!n) return;
      reviewIndex = Math.max(0, Math.min(i, n - 1));
      renderState(lastState);
    }

    function renderTrick(st) {
      const past = st.past_tricks || [];
      const nav = $('trick-nav');
      const box = $('trick');
      if (st.phase === 'handend' && past.length) {
        const i = clampReview(past.length);
        const tr = past[i];
        const cards = tr.cards || [];
        nav.hidden = false;
        $('trick-title').textContent = 'Trick ' + (i + 1) + ' of ' + past.length;
        $('trick-prev').disabled = i <= 0;
        $('trick-next').disabled = i >= past.length - 1;
        box.classList.add('inspect-trick');
        paintTrick(box, cards, { lead: cards.length ? cards[0].seat : null });
        return;
      }
      nav.hidden = true;
      box.classList.remove('inspect-trick');
      paintTrick(box, heldTrick || st.current_trick || []);
    }

    function pocketStacked() {
      return window.matchMedia('(max-width: 700px)').matches;
    }

    function pocketAboveLeft() {
      return window.matchMedia('(max-width: 1024px)').matches;
    }

    // Wide: mid-angle of left ↔ opposite. Narrow: just above the left player.
    // ≤700px: CSS grid (same column as left); JS only clears inline coords.
    function placeSidePocket() {
      const felt = document.querySelector('.felt');
      const pocket = $('side-pocket');
      if (!felt || !pocket) return;
      if (pocket.hidden || pocketStacked()) {
        pocket.style.left = '';
        pocket.style.top = '';
        return;
      }
      const left = document.querySelector('.felt-left');
      const opp = document.querySelector('.felt-opp');
      const center = document.querySelector('.felt-center');
      if (!left || !opp) return;
      const f = felt.getBoundingClientRect();
      const L = left.getBoundingClientRect();
      const cs = getComputedStyle(felt);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padT = parseFloat(cs.paddingTop) || 0;
      let mx;
      let my;
      if (pocketAboveLeft()) {
        const head = document.querySelector('.felt-head');
        const headBottom = head ? head.getBoundingClientRect().bottom : f.top;
        const gap = 10;
        mx = L.left + L.width / 2;
        my = L.top - gap - pocket.offsetHeight / 2;
        const minCy = headBottom + 6 + pocket.offsetHeight / 2;
        if (my < minCy) my = minCy;
      } else {
        const O = opp.getBoundingClientRect();
        const C = (center || felt).getBoundingClientRect();
        const lx = L.left + L.width / 2;
        const ly = L.top + L.height / 2;
        const ox = O.left + O.width / 2;
        const oy = O.top + O.height / 2;
        const cx = C.left + C.width / 2;
        const cy = C.top + C.height / 2;
        mx = (lx + ox) / 2;
        my = (ly + oy) / 2;
        const dx = ox - lx;
        const dy = oy - ly;
        const len = Math.hypot(dx, dy) || 1;
        let px = -dy / len;
        let py = dx / len;
        if (px * (cx - mx) + py * (cy - my) > 0) {
          px = -px;
          py = -py;
        }
        const offset = Math.min(pocket.offsetWidth * 0.42, len * 0.2);
        mx += px * offset;
        my += py * offset;
      }
      pocket.style.left = Math.round(mx - f.left - padL - pocket.offsetWidth / 2) + 'px';
      pocket.style.top = Math.round(my - f.top - padT - pocket.offsetHeight / 2) + 'px';
    }

    function renderSidePocket(st) {
      const pocket = $('side-pocket');
      const box = $('side-cards');
      const label = $('side-label');
      box.innerHTML = '';
      // Kitty while bidding; past tricks after. Never both.
      if (st.phase === 'bidding') {
        pocket.hidden = false;
        box.classList.add('kitty');
        label.textContent = 'Kitty';
        for (let i = 0; i < 4; i++) box.appendChild(A.cardSvg('cbcatsil'));
        requestAnimationFrame(placeSidePocket);
        return;
      }
      const past = st.past_tricks || [];
      if (!past.length) {
        pocket.hidden = true;
        box.classList.remove('kitty');
        pocket.style.left = '';
        pocket.style.top = '';
        return;
      }
      pocket.hidden = false;
      box.classList.remove('kitty');
      label.textContent = 'Past tricks';
      const sel = st.phase === 'handend' ? clampReview(past.length) : -1;
      past.forEach((tr, i) => {
        const mine = (tr.winner & 1) === (me & 1);
        const pile = A.cardSvg(
          mine ? 'csvert' : 'cshoriz',
          'pile ' + teamClass(tr.winner) + (i === sel ? ' selected' : '')
        );
        pile.setAttribute('title', 'Trick ' + (i + 1) + ' won by ' + who(tr.winner));
        pile.addEventListener('click', () => {
          if (lastState && lastState.phase === 'handend') showReview(i);
          else showInspect(i);
        });
        box.appendChild(pile);
      });
      requestAnimationFrame(placeSidePocket);
    }

    function showInspect(i) {
      const past = (lastState && lastState.past_tricks) || [];
      if (!past.length) {
        $('inspect').hidden = true;
        return;
      }
      inspectIndex = Math.max(0, Math.min(i, past.length - 1));
      const tr = past[inspectIndex];
      const cards = tr.cards || [];
      $('inspect-title').textContent = 'Trick ' + (inspectIndex + 1) + ' of ' + past.length;
      paintTrick($('inspect-cards'), cards, {
        lead: cards.length ? cards[0].seat : null,
      });
      $('inspect-prev').disabled = inspectIndex <= 0;
      $('inspect-next').disabled = inspectIndex >= past.length - 1;
      $('inspect').hidden = false;
    }

    function paintHandCard(c, st, legal, picking) {
      const svg = A.cardSvg(c);
      if (st.why === 'play' && legal.has(c)) {
        svg.classList.add('legal');
        svg.addEventListener('click', () => A.send(ws, { action: 'play', card: c }));
      } else if (picking && legal.has(c)) {
        svg.classList.add('legal');
        if (keep.has(c)) svg.classList.add('pick');
        else svg.classList.add('dim');
        svg.addEventListener('click', () => {
          if (keep.has(c)) keep.delete(c);
          else keep.add(c);
          renderState(st);
        });
      } else if (st.why === 'play') {
        svg.classList.add('dim');
      }
      return svg;
    }

    function trumpKey(st) {
      if (trump != null) return SUIT_KEY[trump];
      if (st && st.trump != null) return SUIT_KEY[st.trump];
      return null;
    }

    function applyTrumpPick(st, i) {
      trump = i;
      const key = SUIT_KEY[i];
      handOrder = A.sortCards(displayCards(st), key);
      handMerged = true;
      keep = new Set(handOrder.filter((c) => A.isTrumpCard(c, key)));
      renderState(st);
    }

    function defaultKeepFor(st) {
      const cards = displayCards(st);
      const key = trumpKey(st);
      if (!key) return new Set();
      return new Set(cards.filter((c) => A.isTrumpCard(c, key)));
    }

    function splitHandKitty(st) {
      const hand = (st.hand || '').split(',').filter(Boolean);
      const kit = st.why === 'trumpselect'
        ? (st.kitty || '').split(',').filter(Boolean)
        : [];
      return { hand, kit };
    }

    function displayCards(st) {
      const { hand, kit } = splitHandKitty(st);
      if (kit.length) {
        if (handOrder.length) return handOrder;
        return A.sortCards(hand, null).concat(A.sortCards(kit, null));
      }
      const key = st.trump != null ? SUIT_KEY[st.trump] : null;
      return A.sortCards(hand, key);
    }

    function rankFace(id, trumpKey) {
      const r = id.split('_')[0];
      const face = r === 't' ? '10' : r.toUpperCase();
      if (id === 'a_he' && trumpKey !== 'he') return 'A♥';
      return face;
    }

    function stripTrick(st) {
      if (st.phase === 'handend') {
        const past = st.past_tricks || [];
        if (!past.length) return [];
        return past[clampReview(past.length)].cards || [];
      }
      return heldTrick || st.current_trick || [];
    }

    function paintRankRow(suitKey, asTrump, trumpKey, inHand, onTrick, win, leadToken, quiet) {
      const row = document.createElement('div');
      row.className = 'rank-row' + (asTrump ? ' trump' : ' off') + (quiet ? ' quiet' : '');
      const pip = document.createElement('span');
      pip.className = 'rank-suit';
      pip.appendChild(A.suitSvg(SUIT_KEY.indexOf(suitKey), 'suit'));
      row.appendChild(pip);
      const list = A.rankList(suitKey, asTrump);
      // Trump: split after Q (last honor). Off: K Q J then pips (J is an honor off-suit).
      const honorN = asTrump ? list.findIndex((id) => id[0] === 'q') + 1 : 3;
      const honors = document.createElement('span');
      honors.className = 'rank-run honors';
      const pips = document.createElement('span');
      pips.className = 'rank-run pips';
      const winId = win ? A.tokenToSvg(win.card) : '';
      list.forEach((id, i) => {
        const cell = document.createElement('span');
        cell.className = 'rank-cell';
        cell.textContent = rankFace(id, trumpKey);
        if (id.endsWith('_he') || id.endsWith('_di')) cell.classList.add('red');
        if (id === 'a_he' && trumpKey !== 'he') cell.classList.add('wide');
        if (id[0] === 't') cell.classList.add('wide');
        const held = inHand.has(id);
        if (held) cell.classList.add('held');
        if (id === winId) cell.classList.add('winner');
        else if (onTrick.has(id)) cell.classList.add('played');
        const beats = !!(held && win && leadToken && A.cardBeats(id, win.card, trumpKey, leadToken));
        if (beats) cell.classList.add('beats');
        if (id === winId) cell.title = 'Current winner';
        else if (beats) cell.title = 'Beats current winner';
        else if (held) cell.title = 'In your hand';
        (i < honorN ? honors : pips).appendChild(cell);
      });
      row.appendChild(honors);
      row.appendChild(pips);
      return row;
    }

    function syncRankGear() {
      const gear = $('rank-gear');
      const check = $('rank-check');
      if (check) check.checked = rankLatch;
      gear.classList.toggle('open', gearPopOpen);
      gear.setAttribute('aria-expanded', gearPopOpen ? 'true' : 'false');
    }

    function setGearPop(on) {
      gearPopOpen = !!on;
      $('gear-pop').hidden = !gearPopOpen;
      syncRankGear();
    }

    function setRankLatch(on) {
      rankLatch = !!on;
      try { localStorage.setItem(RANK_PREF, rankLatch ? '1' : '0'); } catch (e) {}
      if (lastState) renderState(lastState);
      else {
        syncRankGear();
        $('rank-strip').hidden = true;
      }
    }

    function renderRankStrip(st) {
      syncRankGear();
      const box = $('rank-strip');
      const named = st && st.trump != null;
      if (!st || !named || !rankLatch) {
        box.hidden = true;
        return;
      }
      const trumpKey = SUIT_KEY[st.trump];
      const cards = stripTrick(st);
      const lead = cards[0];
      // Off row only if the *lead* is non-trump. A♥ is trump; slough after a trump lead is ignored.
      const leadIsTrump = !!(lead && A.isTrumpCard(lead.card, trumpKey));
      const offKey = (lead && !leadIsTrump) ? A.suitOf(lead.card) : null;
      const hand = st.phase === 'handend' ? [] : displayCards(st);
      const inHand = new Set(hand.map(A.tokenToSvg));
      const onTrick = new Set(cards.map((t) => A.tokenToSvg(t.card)));
      const win = A.trickWinner(cards, trumpKey);
      const rows = $('rank-rows');
      rows.innerHTML = '';
      const quietOff = !!(offKey && cards.some((t) => A.isTrumpCard(t.card, trumpKey)));
      rows.appendChild(paintRankRow(trumpKey, true, trumpKey, inHand, onTrick, win, lead && lead.card, false));
      if (offKey) {
        rows.appendChild(paintRankRow(offKey, false, trumpKey, inHand, onTrick, win, lead.card, quietOff));
      } else {
        const spacer = document.createElement('div');
        spacer.className = 'rank-row spacer';
        spacer.setAttribute('aria-hidden', 'true');
        rows.appendChild(spacer);
      }
      box.hidden = false;
    }

    function renderYou(st) {
      const row = $('you-hand');
      row.innerHTML = '';
      if (st.phase !== 'handend') {
        const { kit } = splitHandKitty(st);
        const cards = displayCards(st);
        const legal = new Set((st.legal_cards || '').split(',').filter(Boolean));
        const picking = isActor(st, me) && inKeepPhase(st) && legal.size > 0;
        row.classList.toggle('with-kitty', kit.length > 0);
        cards.forEach((c) => row.appendChild(paintHandCard(c, st, legal, picking)));
        $('hand-sort').hidden = !(st.why === 'trumpselect' && st.declarer === me && kit.length && !handMerged);
        paintOval($('you-bid-oval'), bidMarkFor(st, me));
      } else {
        row.classList.remove('with-kitty');
        $('hand-sort').hidden = true;
        paintOval($('you-bid-oval'), null);
      }
      fillNamebar($('you-bar'), me, (st.actors || []).indexOf(me) >= 0);
      if (st.dealer === me) {
        const cr = A.cardSvg('crown', 'crown');
        cr.setAttribute('viewBox', '0 0 64 64');
        $('you-bar').appendChild(cr);
      }
      const youContract = makeOval(contractMarkFor(st, me));
      if (youContract) $('you-bar').appendChild(youContract);
    }

    function bidBtnSpec(b, high, isDealer) {
      if (b < 15) return { text: 'Pass', cls: 'pass' };
      const amtCls = 'b' + (b >= 30 ? 30 : b);
      const dbl = b >= 30 ? '/' + (b * 2) : '';
      if (b === high && isDealer && high >= 15) {
        return { text: 'Hold ' + b + dbl, cls: amtCls + ' hold' };
      }
      return { text: b + dbl, cls: amtCls };
    }

    function renderContractChip(st) {
      const chip = $('contract-chip');
      if (st.declarer == null) {
        chip.hidden = true;
        return;
      }
      chip.hidden = false;
      $('contract-who').textContent = who(st.declarer);
      const suitEl = $('contract-suit');
      suitEl.innerHTML = '';
      if (st.trump != null) {
        suitEl.appendChild(A.suitSvg(st.trump, 'suit'));
      } else {
        suitEl.appendChild(A.suitSvg(4, 'suit sil'));
      }
      $('contract-bid').textContent = String(st.contract_bid || '');
    }

    function renderKeepPanel(st) {
      const panel = $('keep-panel');
      const trick = $('trick');
      const headline = $('keep-headline');
      const copy = $('keep-copy');
      const chips = $('keep-trumps');
      chips.innerHTML = '';
      headline.textContent = '';
      copy.textContent = '';
      if (!inKeepPhase(st)) {
        panel.hidden = true;
        trick.hidden = false;
        return;
      }
      panel.hidden = false;
      trick.hidden = true;
      const named = st.trump != null ? st.trump : trump;
      const iAmDecl = st.declarer === me;
      const iAct = isActor(st, me);

      if (st.why === 'trumpselect' && iAmDecl) {
        if (named == null) {
          headline.textContent = 'Name trump, then keep five.';
        } else {
          headline.appendChild(document.createTextNode('Trump is '));
          headline.appendChild(A.suitSvg(named, 'suit'));
        }
        [0, 1, 2, 3].forEach((i) => {
          const ic = A.suitSvg(i);
          if (trump === i) ic.classList.add('on');
          else if (trump == null) ic.classList.add('pulse');
          ic.setAttribute('title', SUITS[i]);
          ic.addEventListener('click', () => applyTrumpPick(st, i));
          chips.appendChild(ic);
        });
      } else if (st.why === 'trumpselect') {
        headline.textContent = 'Waiting for ' + who(st.declarer) + ' to name trump…';
      } else {
        if (st.trump != null) {
          headline.appendChild(document.createTextNode('Trump is '));
          headline.appendChild(A.suitSvg(st.trump, 'suit'));
        }
        copy.textContent = iAct
          ? 'Trump cards start kept. Click to change, then confirm.'
          : 'Waiting for others to discard…';
      }
    }

    function renderActs(st) {
      const acts = $('acts');
      const bidActs = $('bid-acts');
      acts.innerHTML = '';
      bidActs.innerHTML = '';
      bidActs.hidden = true;

      if (st.why === 'bid' && st.legal_bids && st.legal_bids.length) {
        const high = currentHigh(st);
        st.legal_bids.forEach((b) => {
          const spec = bidBtnSpec(b, high, st.dealer === me);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = spec.cls;
          btn.textContent = spec.text;
          btn.addEventListener('click', () => A.send(ws, { action: 'bid', bid: b }));
          bidActs.appendChild(btn);
        });
        bidActs.hidden = false;
      }

      if (inKeepPhase(st) && isActor(st, me)) {
        const go = document.createElement('button');
        go.type = 'button';
        const over = keep.size > 5;
        const needTrump = st.why === 'trumpselect' && trump == null;
        go.disabled = over || needTrump;
        go.textContent = over
          ? 'Keep at most 5'
          : needTrump
            ? 'Select trump'
            : (st.why === 'trumpselect' ? 'Name trump & keep' : 'Keep selected');
        go.addEventListener('click', () => {
          const msg = { action: 'selecthand', cards: [...keep].join(',') };
          if (st.why === 'trumpselect') msg.trump = SUITS[trump];
          A.send(ws, msg);
          keep = new Set();
        });
        acts.appendChild(go);
      }

      Object.keys(paused).forEach((seat) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ghost';
        btn.textContent = 'Robot for ' + who(+seat);
        btn.addEventListener('click', () => A.send(ws, { action: 'handoffrobot', seat: +seat }));
        acts.appendChild(btn);
      });
    }

    function renderState(s) {
      lastState = s;
      me = s.seat;
      if (s.phase !== 'handend') reviewIndex = -1;
      else $('inspect').hidden = true;
      noteTrickHold(s);
      $('sc-ew').textContent = s.score[0];
      $('sc-ns').textContent = s.score[1];
      $('meta').textContent = who(s.dealer) + ' deals';
      renderContractChip(s);

      const showF = fillShow(s);
      const glideF = fillGlideNow(s, showF);
      renderSeatBox(2, (me + 2) & 3, s);
      renderSeatBox(1, (me + 1) & 3, s);
      renderSeatBox(3, (me + 3) & 3, s);
      renderKeepPanel(s);
      renderTrick(s);
      renderSidePocket(s);
      renderYou(s);
      renderRankStrip(s);
      renderScorecard(s);
      renderPlayReplay();
      renderFill(s, showF, glideF);
      renderActs(s);
      if (!$('inspect').hidden) showInspect(inspectIndex);
    }

    function fmtHandPts(n) {
      return n >= 0 ? '+' + n : String(n);
    }

    function seriesOver(st) {
      if (!st || st.phase !== 'handend') return false;
      return lastSummary
        ? !!lastSummary.series_over
        : (st.score[0] >= 125 || st.score[1] >= 125);
    }

    // Declarer side wins if they reached 125; otherwise the other side
    // (same XOR as old playEnd when both teams can be over).
    function seriesWinTeam(st, over) {
      if (!over || !st) return null;
      const ew = lastSummary ? lastSummary.tot_ew : st.score[0];
      const ns = lastSummary ? lastSummary.tot_ns : st.score[1];
      const d = st.declarer != null ? (st.declarer & 1) : (ew >= ns ? 0 : 1);
      return ((d === 0 ? ew : ns) >= 125) ? d : 1 - d;
    }

    function applyWinner(st) {
      const team = seriesWinTeam(st, seriesOver(st));
      const card = $('scorecard');
      card.querySelector('.pair-ew .scorecard-dance').classList.toggle('winner', team === 0);
      card.querySelector('.pair-ns .scorecard-dance').classList.toggle('winner', team === 1);
      $('tot-ew').classList.toggle('winner', team === 0);
      $('tot-ns').classList.toggle('winner', team === 1);
    }

    // Replay docks left of the you-namebar whenever the table option is on.
    function renderPlayReplay() {
      $('replay').hidden = !replayOn;
    }

    // Hand-end occupies the vacant hand slot. Series-over nods the winning header.
    function renderScorecard(st) {
      const card = $('scorecard');
      const wrap = $('you-hand-wrap');
      if (st.phase !== 'handend') {
        lastSummary = null;
        card.hidden = true;
        wrap.hidden = false;
        applyWinner(st);
        return;
      }
      wrap.hidden = true;
      card.hidden = false;
      const over = seriesOver(st);
      $('next-hand').textContent = over ? 'New game' : 'Deal again';
      $('score-lbl').textContent = over ? 'Game over' : 'Series';
      $('pts-ew').textContent = lastSummary ? fmtHandPts(lastSummary.pts_ew) : '—';
      $('pts-ns').textContent = lastSummary ? fmtHandPts(lastSummary.pts_ns) : '—';
      $('tot-ew').textContent = lastSummary ? String(lastSummary.tot_ew) : String(st.score[0]);
      $('tot-ns').textContent = lastSummary ? String(lastSummary.tot_ns) : String(st.score[1]);
      const mine = (st.seat & 1) === 0 ? 'ew' : 'ns';
      card.querySelectorAll('.team-ew, .team-ns').forEach((el) => {
        el.classList.toggle('mine', el.classList.contains('team-' + mine));
      });
      $('you-ew').hidden = mine !== 'ew';
      $('you-ns').hidden = mine !== 'ns';
      applyWinner(st);
    }

    function sendReplay() {
      A.send(ws, { action: 'replaydeal' });
    }

    function renderPaused() {
      const seats = Object.keys(paused);
      $('paused').textContent = seats.length
        ? 'Paused: ' + seats.map((s) => paused[s] || who(+s)).join(', ')
        : '';
    }

    function renderHist(j) {
      const box = $('hist');
      box.innerHTML = '';
      const hands = j.hands || [];
      const past = j.past_games || [];
      if (!hands.length && !past.length) {
        const p = document.createElement('p');
        p.innerHTML = '<i>No score history yet</i>';
        box.appendChild(p);
        return;
      }
      past.forEach((g, i) => {
        const p = document.createElement('p');
        p.textContent = `Game ${i + 1}  ${g[0]}–${g[1]}`;
        box.appendChild(p);
      });
      hands.forEach((h, i) => {
        const p = document.createElement('p');
        p.textContent = `H${i + 1}  White ${h.pts_ew} / Red ${h.pts_ns}  tot ${h.tot_ew}–${h.tot_ns}`;
        box.appendChild(p);
      });
    }

    function setHistOpen(on) {
      histOpen = !!on;
      const box = $('hist');
      box.hidden = !histOpen;
      document.querySelectorAll('.score-chip').forEach((el) => {
        el.setAttribute('aria-expanded', histOpen ? 'true' : 'false');
      });
      if (!histOpen) return;
      if (!box.childElementCount) {
        const p = document.createElement('p');
        p.innerHTML = '<i>No score history yet</i>';
        box.appendChild(p);
      }
      if (ws && ws.readyState === 1) A.send(ws, { action: 'getscorehistory' });
    }

    function formatIdleCountdown(sec) {
      const s = Math.max(0, sec | 0);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m > 0 ? `${m}:${String(r).padStart(2, '0')}` : `${s}s`;
    }
    function paintIdleWarnCountdown() {
      const el = $('idle-warn-countdown');
      if (!el || !idleWarnEndsAt) return;
      const left = Math.max(0, Math.ceil((idleWarnEndsAt - Date.now()) / 1000));
      el.textContent = formatIdleCountdown(left);
    }
    function hideIdleWarn() {
      if (idleWarnTick != null) {
        clearInterval(idleWarnTick);
        idleWarnTick = null;
      }
      idleWarnEndsAt = 0;
      const panel = $('panel-idle-warn');
      if (panel) panel.hidden = true;
    }
    function showIdleWarn(endsAt, secondsLeft) {
      const now = Date.now();
      let end = Number(endsAt) || 0;
      if (end < now - 2000) {
        const sec = Math.max(0, Number(secondsLeft) || 0);
        end = now + sec * 1000;
      }
      idleWarnEndsAt = end;
      $('panel-idle-warn').hidden = false;
      paintIdleWarnCountdown();
      if (idleWarnTick != null) clearInterval(idleWarnTick);
      idleWarnTick = setInterval(paintIdleWarnCountdown, 250);
      setStatus('Table idle — Stay or it will close');
    }

    function persistJoined(j) {
      const cur = A.getSession() || sess || {};
      A.setSession({
        username: cur.username || sess.username,
        uuid: cur.uuid || sess.uuid,
        email: cur.email || sess.email || '',
        table: j.table || '1',
        seat: j.seat,
      });
      if (sess) sess.seat = j.seat;
      me = j.seat;
    }

    window.addEventListener('resize', () => requestAnimationFrame(placeSidePocket));
    if (window.matchMedia) {
      window.matchMedia('(max-width: 700px)').addEventListener('change', () => {
        requestAnimationFrame(placeSidePocket);
      });
    }

    $('inspect-close').addEventListener('click', () => { $('inspect').hidden = true; });
    $('inspect-prev').addEventListener('click', (ev) => {
      ev.stopPropagation();
      showInspect(inspectIndex - 1);
    });
    $('inspect-next').addEventListener('click', (ev) => {
      ev.stopPropagation();
      showInspect(inspectIndex + 1);
    });
    $('trick-prev').addEventListener('click', () => {
      if (lastState) showReview(clampReview((lastState.past_tricks || []).length) - 1);
    });
    $('trick-next').addEventListener('click', () => {
      if (lastState) showReview(clampReview((lastState.past_tricks || []).length) + 1);
    });
    document.addEventListener('keydown', (ev) => {
      if (!$('inspect').hidden) {
        if (ev.key === 'ArrowLeft') { ev.preventDefault(); showInspect(inspectIndex - 1); }
        else if (ev.key === 'ArrowRight') { ev.preventDefault(); showInspect(inspectIndex + 1); }
        else if (ev.key === 'Escape') { $('inspect').hidden = true; }
        return;
      }
      if (ev.key === 'Escape' && gearPopOpen) {
        ev.preventDefault();
        setGearPop(false);
        return;
      }
      if (ev.key === 'Escape' && histOpen) {
        ev.preventDefault();
        setHistOpen(false);
        return;
      }
      if (!lastState || lastState.phase !== 'handend') return;
      const n = (lastState.past_tricks || []).length;
      if (!n) return;
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); showReview(clampReview(n) - 1); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); showReview(clampReview(n) + 1); }
      else if (ev.key === 'Escape') { ev.preventDefault(); showReview(n - 1); }
    });
    $('fill-btn').addEventListener('click', () => {
      fillLatch = !fillLatch;
      try { localStorage.setItem(FILL_PREF, fillLatch ? '1' : '0'); } catch (e) {}
      if (lastState) renderState(lastState);
    });
    $('rank-gear').addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (histOpen) setHistOpen(false);
      setGearPop($('gear-pop').hidden);
    });
    $('rank-check').addEventListener('change', () => setRankLatch($('rank-check').checked));
    $('rank-hide').addEventListener('click', () => setRankLatch(false));
    syncRankGear();
    $('inspect').addEventListener('click', (ev) => {
      if (ev.target.id === 'inspect') $('inspect').hidden = true;
    });
    document.querySelectorAll('.score-chip').forEach((el) => {
      el.addEventListener('click', () => setHistOpen(!histOpen));
    });
    document.addEventListener('click', (ev) => {
      if (gearPopOpen && !ev.target.closest('.gear-wrap')) setGearPop(false);
      if (!histOpen) return;
      if (ev.target.closest('.score-chip') || ev.target.closest('#hist')) return;
      setHistOpen(false);
    });
    $('hand-sort').addEventListener('click', () => {
      if (!lastState) return;
      const key = trump == null ? null : SUIT_KEY[trump];
      handOrder = A.sortCards(displayCards(lastState), key);
      handMerged = true;
      renderState(lastState);
    });

    if (!sess || !sess.uuid || !sess.username) {
      setStatus('No lobby session — open the lobby to sit.', 'err');
    } else {
      const table = sess.table || '1';
      const hint = sess.seat != null ? sess.seat : 0;
      me = hint;
      ws = A.connect('game', (j) => {
        if (j.action === 'loggedin') {
          setStatus(sess.seat != null ? 'rejoining' : 'joining…', 'ok');
          A.send(ws, { action: 'joinseat', table, seat: hint });
          return;
        }
        if (j.action === 'joined') {
          persistJoined(j);
          setStatus('joined', 'ok');
          replayOn = !!j.replay;
          renderPlayReplay();
          return;
        }
        if (j.action === 'players') {
          names = j.seats;
          if (lastState) renderState(lastState);
          return;
        }
        if (j.action === 'paused') {
          paused[j.seat] = j.username;
          renderPaused();
          setStatus(j.username + ' disconnected — offer robot or wait', 'err');
          if (lastState) renderState(lastState);
          return;
        }
        if (j.action === 'resumed') {
          delete paused[j.seat];
          renderPaused();
          setStatus(j.username + ' back', 'ok');
          if (lastState) renderState(lastState);
          return;
        }
        if (j.action === 'robottookover') {
          delete paused[j.seat];
          renderPaused();
          setStatus(who(j.seat) + ' is now ' + j.name, 'ok');
          return;
        }
        if (j.action === 'scorehistory') {
          renderHist(j);
          return;
        }
        if (j.action === 'state') {
          const pool = (j.legal_cards || '').split(',').filter(Boolean).sort().join(',');
          if (pool !== keepPool) {
            keep = new Set();
            keepPool = pool;
            handMerged = false;
            trump = null;
            const hand = (j.hand || '').split(',').filter(Boolean);
            const kit = (j.kitty || '').split(',').filter(Boolean);
            if (j.why === 'trumpselect') {
              handOrder = A.sortCards(hand, null).concat(A.sortCards(kit, null));
              // Orig five start selected until a suit is named (then trump + A♥).
              if (j.declarer === me) hand.forEach((c) => keep.add(c));
            } else if (j.why === 'discard') {
              handOrder = [];
              if (j.trump != null) trump = j.trump;
              keep = defaultKeepFor(j);
            } else {
              handOrder = [];
            }
          }
          renderState(j);
          return;
        }
        if (j.action === 'summary') {
          lastSummary = j;
          if (lastState) renderScorecard(lastState);
          return;
        }
        if (j.action === 'idlewarning') {
          showIdleWarn(j.ends_at, j.seconds_left);
          return;
        }
        if (j.action === 'idlewarningcancel') {
          hideIdleWarn();
          return;
        }
        if (j.action === 'shutdown') {
          const s = A.getSession() || {};
          delete s.table;
          delete s.seat;
          A.setSession(s);
          sessionStorage.setItem('a45s.justLeft', '1');
          location.href = 'lobby.html';
          return;
        }
        if (j.action === 'err') {
          if (j.err === 'duplicate_login') {
            setStatus('signed in elsewhere', 'err');
            return;
          }
          if (j.err === 'no_game' || j.err === 'bad_join' || j.err === 'bad_table') {
            setStatus('No live hand at this seat — back to the lobby.', 'err');
            return;
          }
          setStatus(j.err || 'error', 'err');
        }
      }, () => {
        if (!leaving) setStatus('game socket closed', 'err');
      });
      ws.onopen = () => {
        A.send(ws, {
          action: 'login',
          username: sess.username,
          email: sess.email || '',
          uuid: sess.uuid,
        });
      };
      $('replay').addEventListener('click', sendReplay);
      $('next-hand').addEventListener('click', () => A.send(ws, { action: 'nexthand' }));
      $('btn-idle-stay').addEventListener('click', () => {
        A.send(ws, { action: 'idlestay' });
        setStatus('Staying…');
      });
      $('btn-idle-leave').addEventListener('click', () => $('leavegame').click());
      $('leavegame').addEventListener('click', () => {
        leaving = true;
        const s = A.getSession() || {};
        delete s.table;
        delete s.seat;
        A.setSession(s);
        sessionStorage.setItem('a45s.justLeft', '1');
        A.send(ws, { action: 'leavegame' });
        // Let leavegame land before lobby login would rejoin this started table.
        setTimeout(() => { location.href = 'lobby.html'; }, 350);
      });
    }
  </script>
</body>
</html>
